<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keny Admin — Generador de Tickets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 p-6 sm:p-8 rounded-2xl shadow-xl">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-amber-500/10 text-amber-400 rounded-xl mb-3">
        <i class="fa-solid fa-key text-xl"></i>
      </div>
      <h1 class="text-xl font-bold">Panel de Control Keny Support™</h1>
      <p class="text-slate-400 text-xs mt-1">Generador de enlaces de valoración de un solo uso</p>
    </div>

    <!-- Acceso PIN -->
    <div id="login-box" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Clave de acceso</label>
        <input type="password" id="admin-pass" placeholder="Introduce tu clave" class="w-full px-4 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-amber-400">
      </div>
      <button id="btn-login" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm rounded-xl transition">
        Entrar al panel
      </button>
    </div>

    <!-- Generador -->
    <div id="generator-box" class="hidden space-y-4">
      <button id="btn-generate" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-plus-circle"></i>
        <span>Generar nuevo enlace de favor</span>
      </button>

      <div id="result-box" class="hidden mt-4 p-4 bg-slate-950 rounded-xl border border-slate-700 space-y-3">
        <p class="text-xs text-slate-400 font-semibold uppercase">Enlace listo para enviar:</p>
        <input type="text" id="ticket-url" readonly class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-amber-300 text-xs font-mono select-all">
        <button id="btn-copy" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-2">
          <i class="fa-regular fa-copy"></i>
          <span>Copiar al portapapeles</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLMhCpwDWlWVIDGPbc00afieDx8s-MCfKBwXraBTlqWaG5EqNH6Nmp3V-fILazQVvfmw/exec';
    const BASE_URL = 'https://valoracionkeny.netlify.app';

    let savedPass = '';

    const loginBox = document.getElementById('login-box');
    const generatorBox = document.getElementById('generator-box');
    const passInput = document.getElementById('admin-pass');
    const btnLogin = document.getElementById('btn-login');
    const btnGenerate = document.getElementById('btn-generate');
    const resultBox = document.getElementById('result-box');
    const ticketUrlInput = document.getElementById('ticket-url');
    const btnCopy = document.getElementById('btn-copy');

    btnLogin.addEventListener('click', () => {
      const pass = passInput.value.trim();
      if (!pass) return;
      savedPass = pass;
      loginBox.classList.add('hidden');
      generatorBox.classList.remove('hidden');
    });

    btnGenerate.addEventListener('click', async () => {
      btnGenerate.disabled = true;
      btnGenerate.innerHTML = '<span>Generando ticket...</span>';

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=generateTicket&pass=${encodeURIComponent(savedPass)}`);
        const data = await res.json();

        if (data.success) {
          const finalUrl = `${BASE_URL}/?ticket=${data.ticket}`;
          ticketUrlInput.value = finalUrl;
          resultBox.classList.remove('hidden');
        } else {
          alert('Clave incorrecta o no autorizada.');
          loginBox.classList.remove('hidden');
          generatorBox.classList.add('hidden');
        }
      } catch (e) {
        alert('Error al conectar con Google Sheets.');
      } finally {
        btnGenerate.disabled = false;
        btnGenerate.innerHTML = '<i class="fa-solid fa-plus-circle"></i><span>Generar nuevo enlace de favor</span>';
      }
    });

    btnCopy.addEventListener('click', () => {
      navigator.clipboard.writeText(ticketUrlInput.value);
      btnCopy.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i><span>¡Copiado!</span>';
      setTimeout(() => {
        btnCopy.innerHTML = '<i class="fa-regular fa-copy"></i><span>Copiar al portapapeles</span>';
      }, 2000);
    });
  </script>
</body>
</html>
