<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón de Valoraciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .star-btn { transition: transform 0.15s ease, color 0.15s ease; }
    .star-btn:hover { transform: scale(1.18); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between p-4 sm:p-6 font-sans">

  <main class="w-full max-w-lg mx-auto my-auto">
    <!-- Formulario -->
    <div id="card-form" class="bg-white rounded-2xl shadow-lg border border-slate-200/80 p-6 sm:p-8">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-amber-50 text-amber-500 rounded-full mb-3 shadow-inner">
          <i class="fa-solid fa-star text-2xl"></i>
        </div>
		<h1 class="text-2xl font-bold text-slate-900 tracking-tight">Valora a Keny</h1>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Tu opinión le ayuda a mejorar</h1>
        <p class="text-slate-500 text-sm mt-1.5">Tu valoración es completamente privada y confidencial.</p>
      </div>

      <form id="rating-form" class="space-y-5">
        <!-- Selector de Estrellas -->
        <div class="text-center">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">
            Calificación
          </label>
          <div id="stars-container" class="flex justify-center items-center gap-2 sm:gap-3 py-1 text-slate-300">
            <button type="button" class="star-btn text-3xl sm:text-4xl focus:outline-none" data-val="1" aria-label="1 estrella"><i class="fa-solid fa-star"></i></button>
            <button type="button" class="star-btn text-3xl sm:text-4xl focus:outline-none" data-val="2" aria-label="2 estrellas"><i class="fa-solid fa-star"></i></button>
            <button type="button" class="star-btn text-3xl sm:text-4xl focus:outline-none" data-val="3" aria-label="3 estrellas"><i class="fa-solid fa-star"></i></button>
            <button type="button" class="star-btn text-3xl sm:text-4xl focus:outline-none" data-val="4" aria-label="4 estrellas"><i class="fa-solid fa-star"></i></button>
            <button type="button" class="star-btn text-3xl sm:text-4xl focus:outline-none" data-val="5" aria-label="5 estrellas"><i class="fa-solid fa-star"></i></button>
          </div>
          <p id="star-desc" class="text-xs font-medium text-slate-400 mt-2 h-4 transition-colors">Selecciona una puntuación</p>
          <p id="star-error" class="hidden text-xs text-rose-500 font-medium mt-1">Por favor, marca al menos una estrella.</p>
        </div>

        <!-- Nombre (Opcional) -->
        <div>
          <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
            Nombre <span class="text-slate-400 font-normal lowercase">(opcional)</span>
          </label>
          <input 
            type="text" 
            id="name" 
            placeholder="Déjalo en blanco para enviar como anónimo" 
            maxlength="60"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all shadow-sm">
        </div>

        <!-- Comentario -->
        <div>
          <label for="comment" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
            Comentario
          </label>
          <textarea 
            id="comment" 
            rows="4" 
            maxlength="500" 
            placeholder="Escribe aquí tu opinión sincera..." 
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all resize-none shadow-sm"
            required></textarea>
          <div class="text-right text-[11px] text-slate-400 mt-1">
            <span id="char-counter">0</span> / 500
          </div>
        </div>

        <!-- Botón Enviar -->
        <button 
          id="btn-submit" 
          type="submit" 
          class="w-full py-3.5 px-6 bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-xl transition duration-150 shadow-md flex items-center justify-center gap-2">
          <span>Enviar Valoración</span>
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>
    </div>

    <!-- Pantalla de Éxito -->
    <div id="card-success" class="hidden bg-white rounded-2xl shadow-lg border border-slate-200/80 p-8 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full mb-4">
        <i class="fa-solid fa-check text-2xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 mb-2">¡Muchas gracias!</h2>
      <p class="text-slate-500 text-sm mb-6 max-w-xs mx-auto">Tu comentario se ha guardado de manera privada y segura.</p>
      <button 
        id="btn-restart" 
        type="button" 
        class="inline-flex items-center gap-2 px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-xl transition">
        <i class="fa-solid fa-rotate-left text-xs"></i>
        <span>Enviar otra valoración</span>
      </button>
    </div>
  </main>

  <footer class="mt-8 text-center text-xs text-slate-400 w-full">
    <span>Privacidad asegurada</span>
  </footer>

  <script>
    const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzLMhCpwDWlWVIDGPbc00afieDx8s-MCfKBwXraBTlqWaG5EqNH6Nmp3V-fILazQVvfmw/exec';

    const ratingsLabels = { 1: "Pésimo", 2: "Regular", 3: "Bueno", 4: "Muy bueno", 5: "¡Excelente!" };
    let selectedRating = 0;

    const starBtns = document.querySelectorAll('.star-btn');
    const starDesc = document.getElementById('star-desc');
    const starError = document.getElementById('star-error');
    const nameInput = document.getElementById('name');
    const commentInput = document.getElementById('comment');
    const charCounter = document.getElementById('char-counter');
    const form = document.getElementById('rating-form');
    const cardForm = document.getElementById('card-form');
    const cardSuccess = document.getElementById('card-success');
    const btnRestart = document.getElementById('btn-restart');
    const btnSubmit = document.getElementById('btn-submit');

    function paintStars(value) {
      starBtns.forEach(btn => {
        const btnVal = parseInt(btn.dataset.val, 10);
        if (btnVal <= value) {
          btn.classList.remove('text-slate-300');
          btn.classList.add('text-amber-400');
        } else {
          btn.classList.remove('text-amber-400');
          btn.classList.add('text-slate-300');
        }
      });
    }

    starBtns.forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        const val = parseInt(btn.dataset.val, 10);
        paintStars(val);
        starDesc.textContent = ratingsLabels[val];
        starDesc.classList.add('text-amber-600', 'font-semibold');
      });

      btn.addEventListener('mouseleave', () => {
        paintStars(selectedRating);
        if (selectedRating > 0) {
          starDesc.textContent = ratingsLabels[selectedRating];
          starDesc.classList.add('text-amber-600', 'font-semibold');
        } else {
          starDesc.textContent = 'Selecciona una puntuación';
          starDesc.classList.remove('text-amber-600', 'font-semibold');
        }
      });

      btn.addEventListener('click', () => {
        selectedRating = parseInt(btn.dataset.val, 10);
        paintStars(selectedRating);
        starError.classList.add('hidden');
      });
    });

    commentInput.addEventListener('input', () => {
      charCounter.textContent = commentInput.value.length;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (selectedRating === 0) {
        starError.classList.remove('hidden');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Enviando...</span>';

      try {
        await fetch(GOOGLE_SHEET_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            nombre: nameInput.value.trim(),
            estrellas: selectedRating,
            comentario: commentInput.value.trim()
          })
        });

        cardForm.classList.add('hidden');
        cardSuccess.classList.remove('hidden');
      } catch (err) {
        alert('Hubo un problema al enviar la valoración. Por favor, inténtalo de nuevo.');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Enviar Valoración</span><i class="fa-solid fa-paper-plane text-xs"></i>';
      }
    });

    btnRestart.addEventListener('click', () => {
      selectedRating = 0;
      paintStars(0);
      nameInput.value = '';
      commentInput.value = '';
      charCounter.textContent = '0';
      starDesc.textContent = 'Selecciona una puntuación';
      starDesc.classList.remove('text-amber-600', 'font-semibold');
      cardSuccess.classList.add('hidden');
      cardForm.classList.remove('hidden');
    });
  </script>
</body>
</html>
